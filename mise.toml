[tools]
go = "1.27.1"

[tasks.build]
description = "Build for current platform"
run = 'go build -o "bin/sbx-$(go env GOOS)-$(go env GOARCH)" ./cmd/sbx'

[tasks.clean]
description = "Remove all build artifacts"
run = "rm -f bin/*"

[tasks.install]
description = "Build and install for current platform"
run = "go install ./cmd/sbx"

[tasks.uninstall]
description = "Uninstall sbx"
run = "rm $(which sbx)"

[tasks.test]
description = "Run test suite"
run = "go test ./..."

[tasks.ci]
description = "Run CI gates locally"
depends = "test"
run = ["go vet ./...", "test -z \"$(gofmt -l cmd internal)\"", "go mod tidy -diff"]

[tasks.format]
description = "Format source code"
run = "go fmt ./..."

[tasks.tidy]
description = "Tidy module state"
run = "go mod tidy"
