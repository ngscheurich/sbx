image = "alpine:3.20"
cpus = 2
memory = "2G"
shell = "/bin/sh"

[[mounts]]
type = "tmpfs"
target = "/tmp"
size = "512M"

[volumes.cache]
target = "/var/cache"
scope = "project"

[env]
MODE = "test"

[secrets.TOKEN]
from_env = "SBX_PLAN_TOKEN"
allow = ["example.com"]

[network]
policy = "allowlist"
allow = ["example.com"]
dns_nameservers = ["1.1.1.1"]
