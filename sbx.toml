image = "sbx-dev"
cpus = 2
memory = "2G"
shell = "/bin/bash"

[build]
context = "."

[[mounts]]
type = "bind"
source = "~/.agents"
target = "/root/.agents"
read_only = true

[[mounts]]
type = "bind"
source = "~/AGENTS.md"
target = "/root/AGENTS.md"
read_only = true

[[mounts]]
type = "bind"
source = "~/.pi/agent/auth.json"
target = "/root/.pi/agent/auth.json"

[[mounts]]
type = "bind"
source = "~/.pi/agent/settings.json"
target = "/root/.pi/agent/settings.json"

[[mounts]]
type = "bind"
source = "~/.pi/agent/sessions"
target = "/root/.pi/agent/sessions"

[[mounts]]
type = "bind"
source = "~/.pi/agent/skills"
target = "/root/.pi/agent/skills"
read_only = true

[[mounts]]
type = "bind"
source = "~/.pi/agent/extensions"
target = "/root/.pi/agent/extensions"
read_only = true

[[mounts]]
type = "bind"
source = "~/.pi/agent/trust.json"
target = "/root/.pi/agent/trust.json"
read_only = true

[network]
policy = "public"
